name: Monthly Witness

on:
  schedule:
    - cron: "0 13 25 * *" # 25th monthly, 7am Denver in UTC. Reminder run. Sunday manual dispatch is the primary trigger.
  workflow_dispatch:
    inputs:
      journal:
        description: "Paste the month journal excerpt from your Google Doc (300 to 800 words) plus 5-line Sunday context. Redacted only, this text ships into the draft PR."
        required: false
        type: textarea
        default: ""

concurrency:
  group: monthly-witness
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set git identity
        run: |
          git config user.name "cristo-substack-bot"
          git config user.email "cristo-substack-bot@users.noreply.github.com"

      - name: Get run month
        id: rundate
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Install image renderer
        run: pip install --quiet Pillow

      - name: Run OpenCode witness team
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: google/gemini-3.5-flash-lite
          use_github_token: true
          prompt: |
            Solo run in this repo, ONE session, never delegate, Task tool is disabled.
            Month for this run: ${{ steps.rundate.outputs.month }}. Use folder cristo/${{ steps.rundate.outputs.month }}. Source journal lives in inbox/ plus the pasted excerpt below.
            Pasted journal excerpt plus Sunday context (may be empty on scheduled runs, then mine inbox/ only):
            ---
            ${{ inputs.journal }}
            ---
            Follow prompts/orchestrate.md exactly, all seven phases inline: mine, research, ideate, article, teaser, visual, gate plus meta.
            Brand v0 (not locked): Temple White #FFFFFF, Parchment #F5F0E6, Deep Night #1A1A2E, Gold #C9A86A hairlines. Reverent serif headlines, Montserrat subtext. Protest Guerrilla, Carter One, Last Shuriken banned.
            Bans: never generate the face of Christ. Never reproduce copyrighted paintings. Link and describe only.
            Never push secrets. Work on the checked-out files; do not push directly. Partial files beat no files.

      # Note: no separate PR step. The opencode CLI pushes branch
      # opencode/dispatch-* and opens the review PR itself on every run.
